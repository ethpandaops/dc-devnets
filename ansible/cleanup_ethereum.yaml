- hosts: all, !localhost
  serial: "{{ batch_count | default('100%') }}"
  become: true
  tasks:
    #- name:
    #  ansible.builtin.pause:
    #    prompt: |+
    #      =========================================================
    #                  !!!!!!!!!  WARNING  !!!!!!!!!
    #      =========================================================
    #      You're about to cleanup all data on the following nodes:
    #      {% for host in ansible_play_hosts_all | sort %}
    #        - {{ host }}
    #      {% endfor %}
    #      =========================================================
    #      Are you sure you want to continue? (yes/no)
    #  register: prompt
    - name: Cleanup all data
      #when: prompt.user_input == "yes"
      block:
        - name: Remove eth containers
          community.docker.docker_container:
            name: "{{ item }}"
            state: absent
            timeout: 5
            force_kill: true
          loop:
            # Execution layer clients
            - "besu"
            - "erigon-init"
            - "erigon"
            - "ethereumjs"
            - "geth-init"
            - "geth"
            - "nethermind"
            - "reth"
            - "execution"
            - "execution-init"
            - "nimbusel"
            - "ethrex"
            # Consensus layer clients
            - "lighthouse-validator"
            - "lighthouse"
            - "lodestar-validator"
            - "lodestar"
            - "nimbus"
            - "prysm-validator"
            - "prysm"
            - "teku-validator"
            - "teku"
            - "grandine"
            - "beacon"
            - "validator"
            - "grandine"
            # Others
            - "ethereum-metrics-exporter"
            - "snooper-engine"
            - "snooper-rpc"
            - "cl-bootnode"
            - "mev-boost"
            - "external-block-builder"
            - "xatu-sentry"
            - "mev-relay-api"
            - "mev-relay-housekeeper"
            - "mev-relay-website"
            - "mev-relay-redis"
            - "mev-relay-database"

        - name: Remove data dirs
          file:
            state: absent
            path: "{{ item }}"
          loop:
            # Execution layer data
            - /data/besu
            - /data/erigon
            - /data/ethereumjs
            - /data/geth
            - /data/nethermind
            - /data/reth
            - /data/nimbusel
            - /data/ethrex
            # Consensus layer data
            - /data/lighthouse
            - /data/lodestar
            - /data/nimbus
            - /data/prysm
            - /data/teku
            - /data/grandine
            # Config files
            - /data/ethereum-network-config
            - /data/execution-auth.secret
            - /data/cl-bootnode
            - /data/xatu-sentry
            # MEV
            - /data/mev_relay

        - name: Remove validator data but keep the deployed keys
          ansible.builtin.shell: |
            [ -d "{{ item }}" ] || exit 0
            find "{{ item }}" -mindepth 1 -maxdepth 1 \
              ! -name wallet ! -name wallet_pass.txt \
              ! -name keys ! -name secrets ! -name keystores \
              ! -name teku-keys ! -name teku-secrets ! -name lodestar-secrets \
              ! -name .validator_keyrange ! -name change_operations.json \
              -print -exec rm -rf {} +
          register: cleanup_validator_dirs
          changed_when: cleanup_validator_dirs.stdout | length > 0
          loop:
            - /data/lighthouse-validator
            - /data/lodestar-validator
            - /data/nimbus-validator
            - /data/prysm-validator
            - /data/teku-validator
            - /data/grandine-validator
